[package]
name = "bacup_lib_native"
version = "0.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = []
packaged-creation = ["dep:creation_native"]
dhat-heap = ["esp_authoring_core/dhat-heap"]

[dependencies]
creation_native = { package = "py_creation_lib_native", path = "../../../../py_creation_lib/native/creation_lib_native", features = ["embedded"], optional = true }
conversion_native  = { path = "../conversion" }
esp_authoring_core = { path = "../../../../py_creation_lib/native/esp" }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }
