  target_record_type: MISC

PWAT:
  target_record_type: REFR

RCCT:
  target_record_type: KYWD

RCPE:
  target_record_type: COBJ

CREA:
  target_record_type: NPC_
  fields:
    DATA: DATA
    DNAM: DNAM

  transforms:
    Name:
      type: trim_languages
      keep: [English]

  drop:
  - CNTO
  - COED
  - Type

WEAP:
  fields:
    DNAM: DNAM

  transforms:
    Name:
      type: trim_languages
      keep: [English]
  drop:
  - Ammo
  - VATS

COBJ:
  drop:
  - Name
  - DATA

AMMO:
  fields:
    Name: Name

  transforms:
    Name:
      type: trim_languages
      keep: [English]
  drop:
  - Data

PROJ:
  fields:
    Name: Name

  drop:
  - Data

EXPL:
  fields:
    Name: Name
    Data: Data

NPC_:
