skip_records:
  # FO4 NAVI is rebuilt from the emitted NAVM graph with NVER=15. Copying the
  # Gamebryo NVER=11/NVMI byte layout into FO4 is structurally invalid.
  - NAVI
  - NAVM
  # Source-only gameplay/UI records with no FO4 runtime analogue. AMEF is
  # folded into AMMO by the legacy ammo lowerer; appearance is rebuilt on the
  # target actor rather than by copying HAIR records.
  - ALOC
  - AMEF
  - CHAL
  - CDCK
  - CSNO
  - DEHY
  - HAIR
  - HUNG
  - LSCT
  - MICN
  - MSET
  - RADS
  - REPU
  - RGDL
  - SLPD
  # Gamebryo IDLE records do not carry FO4's behavior graph, animation event,
  # or animation-file contract. The conversion also ships no legacy HKX files,
  # so emitting these records makes CK build clip data from incomplete entries.
  - IDLE
  - IDLM
  - ANIO
  # FNV IMOD carries a `struct:I,f` value/weight DATA. FO4 OMOD DATA is the
  # `omod_data` blob (28-byte minimum: counts, form type, attach point, then
  # the attach-parent-slot and item arrays), so a verbatim copy makes
  # BGSAttachParentArray::Load read a bogus slot count off the end of the
  # chunk and hard-crash the loader. Emitting OMOD needs the attach-point
  # KYWD / loose-mod MISC / COBJ fan-out in bacup_lib.weapon_attachment_synth,
  # which nothing calls yet.
  - IMOD

# Explicit ownership for records that do not need a field-map entry.  A target
# projection is a deliberate policy: decode with the FNV schema, retain only
# FO4-recognized subrecords, re-encode with the FO4 codec, and preserve source
# ordering only inside target scopes.  This list is audited per signature; an
# undeclared same-4CC record may not silently pass through.
record_routes:
  compatible: [PLYR, TES4, VTYP]
  target_projection:
    - ASPC
    - AVIF
    - CAMS
    - CLMT
    - CONT
    - CPTH
    - DOBJ
    - DOOR
    - ECZN
    - ENCH
    - FLST
    - GRAS
    - GMST
    - IMAD
    - IMGS
    - INGR
    - LGTM
    - LIGH
    - LSCR
    - MESG
    - NOTE
    - REGN
    - SCOL
    - SPEL
    - STAT
    - TACT
    - TREE
  pair_hook:
    - ADDN
    - BPTD
    - CSTY
    - DEBR
    - EFSH
    - EYES
    - FACT
    - HDPT
    - IPDS
    - LAND
    - LTEX
    - MUSC
    - PACK
    - PERK
    - SOUN
    # SOUN is rewritten to a complete FO4 SNDR before route lookup.
    - SNDR
    - TERM
    - TXST
    - WATR
    - WTHR
  topology_rebuild: [ACRE, CELL, PBEA, PGRE, PMIS]

material_overrides:
  bgsm_default:
    bCastShadows: true

