    notes_by_conversion:
      "fo76:fo4":
        - New Look and Feel
        - Conversion time should be a lot faster (I hope)
        - Added custom F4SE plugin to support Bows and various weapons that Fo4 has no support FOR
        - All weapons should now be working
        - All creatures should now be working
        - Using Fallout 76 behaivors for creatures and weapons to support custom movements and attack types. This is a huge change.
        - There should hopefully be less wendigos around the world
        - Fixed some outfits being invisible/missing hands
        - Silos should now Load
        - Fixed more collision issues :<
        - Fixed more Scripts
        - Music now plays with instruments (had to make custom papyrus)
        - C.A.M.P. now functions more like fo76 and should not crash OG
        - Fixed missing floor in whitespring
        - Fixed issues with AnimText generation (cannot walk backwards)
        - Quest workshop items should now be buildable
        - Plans can now be read / known (used for quests atm)
        - You should no longer be mis-genered by lacey
        - Stimpacks and such should work now
        - Fixed Issue where version number wasnt getting written
        - Glowing enemies look correct
        - More camp items added (had bad keywords)
        - Shelters should now have the ability to travel back and forth
        - Wendigos no longer push you into the air.
        - mothman eyes should glow again
